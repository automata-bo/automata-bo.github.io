name: Check Automata chat Worker
on:
  pull_request:
    paths:
      - "worker/**"
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:contract
      - run: npm run test:runtime
      - run: node --check scripts/test-assistant-live.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
