name: Check Automata chat Worker
on:
  pull_request:
    paths:
      - "worker/**"
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Report dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            const totals = report.metadata?.vulnerabilities ?? {};
            console.log("npm audit summary:", JSON.stringify(totals));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                via: item.via,
                effects: item.effects,
                fixAvailable: item.fixAvailable
              }));
            }
          '
      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:contract
      - run: npm run test:runtime
      - run: node --check scripts/test-assistant-live.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Upload generated Worker lockfile
        uses: actions/upload-artifact@v4
        with:
          name: worker-package-lock
          path: worker/package-lock.json
          if-no-files-found: error
