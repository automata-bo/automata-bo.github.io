name: Deploy Automata site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build site
        run: npm run build
        env:
          VITE_AUTOMATA_API_URL: ${{ vars.VITE_AUTOMATA_API_URL }}
      - name: Include loading intro assets in Pages artifact
        run: |
          mkdir -p dist/intro
          cp -a intro/. dist/intro/
          test -s dist/intro/intro.js
          test -s dist/intro/intro.css
          test -s dist/intro/logo-blanco.webp
          test -s dist/intro/logo-color.webp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
