name: Build visual preview
on:
  push:
    branches:
      - feature/automata-web-v2-architecture
      - feat/morph-bilingual-motion
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm install
      - name: Build feature branch
        run: npm run build
      - name: Install Chromium for screenshots
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile pages
        run: |
          mkdir -p preview-shots
          npm run preview -- --host 127.0.0.1 > /tmp/automata-preview.log 2>&1 &
          echo $! > /tmp/automata-preview.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/automata-preview.log
            echo "Preview server did not become ready."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const routes = [
            ["/", "home"],
            ["/digital/", "digital"],
            ["/experiences/", "experiences"],
            ["/studio/", "studio"],
            ["/proyectos/", "proyectos"],
            ["/contacto/", "contacto"],
            ["/experiences/demo/", "invitacion-demo"],
            ["/studio/lab/", "creative-lab"],
            ["/demos/", "flujos-demo"]
          ];
          const failures = [];
          for (const [route, name] of routes) {
            for (const viewport of [
              { label: "desktop", width: 1440, height: 1000 },
              { label: "mobile", width: 390, height: 844 }
            ]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
              const runtimeErrors = [];
              page.on("pageerror", error => runtimeErrors.push(error.message));
              try {
                const response = await page.goto("http://127.0.0.1:4173" + route, { waitUntil: "domcontentloaded", timeout: 15000 });
                if (!response || !response.ok()) {
                  throw new Error(`HTTP ${response?.status() ?? "no response"}`);
                }
                // Make scroll-reveal content visible in full-page captures; the preview must not
                // depend on a human scrolling through every section before the screenshot.
                await page.addStyleTag({ content: ".auto-reveal { opacity: 1 !important; filter: none !important; transform: none !important; }" });
                await page.evaluate(() => document.fonts.ready);
                await page.screenshot({ path: `preview-shots/${name}-${viewport.label}.png`, fullPage: true, animations: "disabled" });
                if (route === "/") {
                  // Morph's first randomized transition takes up to 8.2 seconds to complete.
                  await page.waitForTimeout(9000);
                  await page.screenshot({ path: `preview-shots/home-morph-active-${viewport.label}.png`, fullPage: true, animations: "disabled" });
                }
                if (runtimeErrors.length) {
                  throw new Error(`Browser runtime errors: ${runtimeErrors.join("; ")}`);
                }
                console.log(`OK ${route} [${viewport.label}] HTTP ${response.status()}`);
              } catch (error) {
                failures.push(`${route} [${viewport.label}]: ${error.message}`);
                console.error(failures.at(-1));
              } finally {
                await page.close();
              }
            }
          }
          const smokePage = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          try {
            await smokePage.addInitScript(() => {
              window.__automataOpenedUrl = "";
              window.open = ((url) => { window.__automataOpenedUrl = String(url ?? ""); return null; });
            });
            await smokePage.goto("http://127.0.0.1:4173/", { waitUntil: "domcontentloaded", timeout: 15000 });
            await smokePage.locator(".auto-hero .auto-actions button").click();
            const advisor = smokePage.getByRole("dialog", { name: "Asistente virtual de Automata" });
            await advisor.waitFor({ state: "visible" });
            await advisor.getByRole("button", { name: "Cerrar chat" }).click();

            // The three original floating panels must expose real subservices and deep links.
            for (const [index, expected, count] of [[0, /Sitios web y experiencias/, 6], [1, /Invitaciones digitales/, 5], [2, /Dirección creativa/, 5]]) {
              const division = smokePage.locator(".auto-division").nth(index);
              await division.scrollIntoViewIfNeeded();
              await division.click();
              const panel = smokePage.locator(".auto-division-modal");
              await panel.waitFor({ state: "visible" });
              if (await panel.locator(".auto-division-modal-subservices a").count() !== count) throw new Error(`Division ${index} has an unexpected subservice count`);
              await panel.getByRole("link", { name: expected }).waitFor({ state: "visible" });
              await panel.getByRole("button", { name: "Cerrar ventana" }).click();
            }

            // Every section after Three Divisions must remain reachable by ordinary scrolling.
            for (const selector of ["#morph", "#explora", "#proyectos", ".auto-contact"]) {
              const section = smokePage.locator(selector);
              await section.scrollIntoViewIfNeeded();
              const inViewport = await section.evaluate(el => {
                const rect = el.getBoundingClientRect();
                return rect.bottom > 0 && rect.top < window.innerHeight;
              });
              if (!inViewport) throw new Error(`Home section is not reachable: ${selector}`);
            }
            await smokePage.goto("http://127.0.0.1:4173/", { waitUntil: "domcontentloaded", timeout: 15000 });
            await smokePage.getByRole("tab", { name: /Shared memories|Recuerdos compartidos/ }).click();
            const weddingCopy = smokePage.locator(".auto-demo-preview .message-human p .bilingual-motion");
            await weddingCopy.scrollIntoViewIfNeeded();
            await smokePage.waitForFunction(() =>
              document.querySelector(".auto-demo-preview .message-human p .bilingual-motion")?.getAttribute("aria-label")
                === "I want wedding guests to share their photos."
            );
            // The language rotation is time-based; navigation and panel behavior are the smoke-test target.
            await smokePage.getByRole("tab", { name: /An idea to tell|Una idea que contar/ }).click();
            const studioCopy = smokePage.locator(".auto-demo-preview .message-human p .bilingual-motion");
            await studioCopy.scrollIntoViewIfNeeded();
            await smokePage.waitForFunction(() =>
              document.querySelector(".auto-demo-preview .message-human p .bilingual-motion")?.getAttribute("aria-label")
                === "I need to present a product in a different way."
            );

            await smokePage.goto("http://127.0.0.1:4173/digital/", { waitUntil: "domcontentloaded", timeout: 15000 });
            if (await smokePage.locator(".auto-division-modal-subservices").count() !== 0) throw new Error("Unexpected home modal on Digital page");
            if (await smokePage.locator("#sitios-web, #asistentes-digitales, #automatizacion, #aplicaciones-sistemas, #ia-aplicada, #integraciones").count() !== 6) throw new Error("Digital subservices are missing");
            await smokePage.getByRole("button", { name: /Un consultorio/ }).click();
            await smokePage.getByText(/Una primera orientación ordenada/).waitFor({ state: "visible" });
            await smokePage.getByRole("button", { name: /Find a solution|Encuentra una solución/ }).click();
            const digitalAdvisor = smokePage.getByRole("dialog", { name: "Asistente virtual de Automata" });
            await digitalAdvisor.waitFor({ state: "visible" });
            await digitalAdvisor.getByRole("textbox", { name: "Escribe tu consulta" }).waitFor({ state: "visible" });

            await smokePage.goto("http://127.0.0.1:4173/experiences/", { waitUntil: "domcontentloaded", timeout: 15000 });
            if (await smokePage.locator("#invitaciones, #asistencia, #experiencias-qr, #fotografias, #album").count() !== 5) throw new Error("Experiences subservices are missing");
            await smokePage.getByRole("button", { name: "Participación" }).first().click();
            await smokePage.getByText(/Cada invitado forma parte del recuerdo/).waitFor({ state: "visible" });

            await smokePage.goto("http://127.0.0.1:4173/studio/", { waitUntil: "domcontentloaded", timeout: 15000 });
            if (await smokePage.locator("#direccion-creativa, #fotografia, #produccion-audiovisual, #campanas-contenido, #creacion-hibrida").count() !== 5) throw new Error("Studio subservices are missing");
            await smokePage.getByLabel("Marca o proyecto").fill("Marca QA");
            await smokePage.getByLabel("Objetivo").selectOption("conversion");
            await smokePage.getByLabel("Formato").selectOption("spot");
            await smokePage.getByRole("button", { name: /Construir dirección creativa/ }).click();
            await smokePage.getByText(/Una pieza directa que responde una duda/).waitFor({ state: "visible" });

            await smokePage.goto("http://127.0.0.1:4173/proyectos/", { waitUntil: "domcontentloaded", timeout: 15000 });
            await smokePage.getByRole("button", { name: "Studio" }).click();
            await smokePage.getByRole("heading", { name: "Creative Lab" }).waitFor({ state: "visible" });

            await smokePage.goto("http://127.0.0.1:4173/contacto/", { waitUntil: "domcontentloaded", timeout: 15000 });
            await smokePage.getByRole("button", { name: "Negocio local" }).click();
            await smokePage.getByRole("button", { name: "Digital" }).click();
            await smokePage.getByLabel("¿Qué quieres conseguir?").fill("Quiero organizar las consultas que llegan a mi negocio por WhatsApp.");
            await smokePage.getByRole("button", { name: /Continuar con el asesor/ }).click();
            const contactAdvisor = smokePage.getByRole("dialog", { name: "Asistente virtual de Automata" });
            const contactDraft = await contactAdvisor.getByRole("textbox", { name: "Escribe tu consulta" }).inputValue();
            if (contactDraft !== "Quiero explorar una solución para: Digital. Mi objetivo es: Quiero organizar las consultas que llegan a mi negocio por WhatsApp.") throw new Error(`Unexpected contact draft: ${contactDraft}`);

            await smokePage.goto("http://127.0.0.1:4173/demos/", { waitUntil: "domcontentloaded", timeout: 15000 });
            await smokePage.getByRole("button", { name: "Añadir" }).first().click();
            await smokePage.getByRole("button", { name: "Registrar pedido" }).click();
            await smokePage.getByText("Pedido registrado. Simulación lista.").waitFor({ state: "visible" });
            console.log("OK interactive showroom smoke tests: home, all sections, advisor context, contact brief and digital demo");
          } catch (error) {
            failures.push(`interactive showroom smoke test: ${error.message}`);
            console.error(failures.at(-1));
          } finally {
            await smokePage.close();
          }
          await browser.close();
          if (failures.length) {
            throw new Error(`Visual preview checks failed:\\n${failures.join("\\n")}`);
          }
          NODE
      - name: Package interactive preview
        run: |
          mkdir -p preview-package
          cp -R dist preview-package/site
          cp -R preview-shots preview-package/screenshots
          cat > preview-package/README.txt <<'EOF'
          AUTOMATA V2 · Visual preview from the feature branch
          
          The screenshots show desktop (1440px) and mobile (390px) captures.
          The site/ directory contains the built static site.
          This artifact is a review snapshot. It is not a production deployment.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: automata-v2-visual-preview
          path: preview-package/
          retention-days: 7
